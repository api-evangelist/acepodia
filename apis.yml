aid: acepodia
name: Acepodia
description: 'Acepodia is a clinical-stage biotechnology company founded in 2017 by
  Dr. Patrick Y. Yang and Dr. Sonny Hsiao, headquartered in Alameda, California with
  operations in Taipei, Taiwan. It develops off-the-shelf allogeneic cell therapies
  for cancer and autoimmune disease built on two proprietary platforms: Antibody-Cell
  Conjugation (ACC), which uses bioorthogonal click chemistry from Carolyn Bertozzi''s
  Nobel Prize-winning work to attach tumor-targeting antibodies to gamma delta 2 T
  cells and natural killer cells without genetic engineering, and Antibody-Dual-Drugs
  Conjugation (AD2C). Its clinical pipeline includes ACE1831, an anti-CD20 gamma delta
  T cell therapy, and ACE2016, an anti-EGFR gamma delta T cell therapy. Acepodia is
  a therapeutics developer rather than a software vendor, and publishes no public API,
  developer portal, or machine-readable specification.'
